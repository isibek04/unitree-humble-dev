name: build image

# Builds the Containerfile and pushes it to
#   ghcr.io/<owner>/unitree-humble-dev
# Tags: latest (default branch), sha-<commit>, and YYYYMMDD on nightly rebuilds.
# Pull requests only build (no push) to check the Containerfile still works.

on:
  push:
    branches: [main]
    paths: &image-paths
      - Containerfile
      - unitree-env.sh
      - .github/workflows/build.yml
  pull_request:
    paths: *image-paths
  # Nightly rebuild of the runtime stage without cache, so the image picks up
  # Ubuntu/ROS security updates and new commits in the Unitree repos.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      no-cache:
        description: Rebuild every layer from scratch
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The runner's default ~14 GB free is too tight for the ROS + torch layers.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/unitree-humble-dev
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=sha
          labels: |
            org.opencontainers.image.title=unitree-humble-dev
            org.opencontainers.image.description=Ubuntu 22.04 + ROS 2 Humble + Unitree SDK dev environment for Unitree robots

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          # Nightly refreshes only the final stage; the Mesa build (pinned by
          # MESA_VERSION) stays cached so it isn't recompiled every night.
          no-cache: ${{ inputs.no-cache == true }}
          no-cache-filters: ${{ github.event_name == 'schedule' && 'runtime' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
